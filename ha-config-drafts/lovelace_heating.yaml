views:
- title: Home
  cards:
  - type: entities
    entities:
    - entity: climate.hall
      name: Nest thermostat
    - entity: sensor.aqara_temperature_sensor_temperature
      name: Leo's room
    - entity: sensor.tuya_temperature_sensor_temperature
      name: Parents room
    - entity: sensor.laundry_temperature_temperature
  - type: vertical-stack
    cards:
    - type: gauge
      entity: sensor.opentherm_flow_temperature
      name: Boiler flow temperature
      min: 0
      max: 60
      needle: true
      segments:
      - from: 0
        color: '#43a047'
      - from: 25
        color: '#9ccc65'
      - from: 35
        color: '#fdd835'
      - from: 45
        color: '#fb8c00'
      - from: 55
        color: '#e53935'
      tap_action:
        action: more-info
        entity: number.multi_trv_heating_controller_flow_override
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.multi_trv_heating_controller_flow_override_active
        state: 'on'
      card:
        type: tile
        entity: button.multi_trv_heating_controller_cancel_flow_override
        name: Cancel flow override
        icon: mdi:cancel
        vertical: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.multi_trv_heating_controller_cancel_flow_override
  - type: vertical-stack
    cards:
    - type: tile
      entity: climate.living_room_heating_thermostat
      name: Living Room Heating
      features:
      - type: target-temperature
      vertical: false
    - type: horizontal-stack
      cards:
      - type: tile
        entity: sensor.radiator_1_living_room_position
        name: Living Room
        vertical: false
      - type: tile
        entity: sensor.radiator_1_living_room_battery
        name: Battery
        vertical: false
      - type: tile
        entity: switch.radiator_1_living_room_boost_heating
        name: Boost
        vertical: false
        tap_action:
          action: more-info
